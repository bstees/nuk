name: Production candidate gate (no deployment)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Reviewed commit to package as a production candidate.
        required: true
        default: main
        type: string
      review_record:
        description: Link or identifier for the human approval record.
        required: true
        type: string
      confirm_reviewed:
        description: I understand this only creates a candidate and does not deploy it.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  candidate:
    if: ${{ inputs.confirm_reviewed }}
    name: Environment-approved build and manifest
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      REVIEW_RECORD: ${{ inputs.review_record }}
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}

      - name: Require a commit already reachable from main
        shell: bash
        run: |
          candidate=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$candidate" origin/main || {
            echo "The production candidate must already be reachable from main." >&2
            exit 1
          }
          echo "SOURCE_COMMIT=$candidate" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable the repository package manager
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run the complete quality gate
        run: pnpm check

      - name: Build candidate sites and SBOM
        run: |
          pnpm storybook:build
          pnpm digest:build
          pnpm sbom:generate

      - name: Create the explicit no-deployment manifest
        run: |
          mkdir -p production-candidate
          node <<'NODE'
          const { cpSync, mkdirSync, writeFileSync } = require('node:fs');
          mkdirSync('production-candidate/storybook', { recursive: true });
          mkdirSync('production-candidate/digest', { recursive: true });
          cpSync('apps/storybook/storybook-static', 'production-candidate/storybook', { recursive: true });
          cpSync('apps/digest/dist', 'production-candidate/digest', { recursive: true });
          cpSync('outputs/sbom.cdx.json', 'production-candidate/sbom.cdx.json');
          writeFileSync('production-candidate/deployment-plan.json', `${JSON.stringify({
            schemaVersion: 1,
            sourceCommit: process.env.SOURCE_COMMIT,
            reviewRecord: process.env.REVIEW_RECORD,
            environment: 'production',
            status: 'not-deployed',
            terraformApplied: false,
            cloudCredentialsRequested: false,
            nextGate: 'A separately authorized workflow must verify OIDC, destinations, checksums, and rollback before upload.',
          }, null, 2)}\n`);
          NODE

      - name: Upload the approved candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-candidate-${{ github.run_id }}
          path: production-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
