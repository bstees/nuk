name: Main branch verification

on:
  push:
    branches: [main]

concurrency:
  group: main-verification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the integrated workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out the integrated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable the repository package manager
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the integrated quality gate
        run: pnpm check

      - name: Run the clean-room proof
        run: pnpm forge:proof

  static-artifacts:
    name: Produce reviewable static artifacts
    needs: verify
    uses: ./.github/workflows/static-artifacts.yml
    permissions:
      contents: read
