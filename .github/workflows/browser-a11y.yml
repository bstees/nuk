name: Browser and accessibility tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/storybook/**'
      - 'packages/elements/**'
      - 'packages/react/**'
      - 'packages/theme/**'
      - 'packages/tokens/**'
      - 'tests/browser/**'
      - 'playwright.config.*'
      - 'pnpm-lock.yaml'
      - '.github/workflows/browser-a11y.yml'
  push:
    branches: [main]
    paths:
      - 'apps/storybook/**'
      - 'packages/elements/**'
      - 'packages/react/**'
      - 'packages/theme/**'
      - 'packages/tokens/**'
      - 'tests/browser/**'
      - 'playwright.config.*'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: browser-a11y-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-matrix:
    name: Playwright interactions, reflow, and axe checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Enable the repository package manager
        run: corepack enable pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the target browser runtimes
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser and accessibility coverage
        run: pnpm test:browser

      - name: Preserve the browser report on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
